sources:
  - url: https://openprescribing.net/api/
    type: Documentation
    note: Official API documentation page (HTML). Live but returns 403 to bots via Cloudflare challenge.
  - url: https://github.com/bennettoxford/openprescribing/blob/main/openprescribing/api/urls.py
    type: SourceCode
    note: Authoritative Django URLconf — all /api/1.0/ routes read verbatim here.
  - url: https://github.com/bennettoxford/openprescribing/blob/main/openprescribing/templates/api.html
    type: Documentation
    note: Source of the human-readable API docs; confirms JSON/CSV formats and "no registration required".
  - url: https://www.bennett.ox.ac.uk/openprescribing/
    type: About
    note: Bennett Institute project page for OpenPrescribing.
actions:
