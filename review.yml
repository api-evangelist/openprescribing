    - GET https://openprescribing.net/api/1.0/price_per_unit/
    - GET https://openprescribing.net/api/1.0/ghost_generics/
    - GET https://openprescribing.net/api/1.0/measure/
    - GET https://openprescribing.net/api/1.0/measure_by_regional_team/
    - GET https://openprescribing.net/api/1.0/measure_by_icb/
    - GET https://openprescribing.net/api/1.0/measure_by_sicbl/
    - GET https://openprescribing.net/api/1.0/measure_by_pcn/
    - GET https://openprescribing.net/api/1.0/measure_by_practice/
    - GET https://openprescribing.net/api/1.0/measure_numerators_by_org/
    - GET https://openprescribing.net/api/1.0/bnf_code/
    - GET https://openprescribing.net/api/1.0/org_code/
