name: OpenPrescribing
kind: company
description: >-
  OpenPrescribing.net is an open-data service built and operated by the Bennett
  Institute for Applied Data Science at the University of Oxford. It turns the English
  Prescribing Dataset published monthly by the NHS Business Services Authority into public
  dashboards, prescribing-safety measures, and a free RESTful API covering primary-care
  GP prescribing across England. The API exposes spending, quantity and item counts by
  BNF code and by NHS organisation (practice, PCN, Sub-ICB Location, ICB, Regional Team),
  standardised prescribing measures, drug-tariff and price-per-unit data, and organisation
  reference/boundary lookups, all returned as JSON, CSV or GeoJSON. Home market is the
  United Kingdom (England prescribing data). It is an independent academic analytics
  platform layered on NHS open data, not an NHS FHIR clinical system; there is no OAuth,
  no SMART-on-FHIR, and currently no registration or API key is required.
